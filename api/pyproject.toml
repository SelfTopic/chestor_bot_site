[project]
name = "chestor-api"
version = "0.1.0"
description = "Backend of chestor-bot.site: quiz now, later the mascot chat and live game data"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "aiohttp (>=3.14.3,<4.0.0)",
    "ghoul-quiz-lib @ git+https://github.com/SelfTopic/questions_ghoul_api_lib.git",
]

[tool.poetry]
package-mode = true
packages = [{ include = "chestor_api" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"
pytest-aiohttp = "^1.1"
ruff = "^0.14"
pyright = "^1.1.400"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["chestor_api", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
