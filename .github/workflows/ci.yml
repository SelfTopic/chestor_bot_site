name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Бот сможет пересобирать сайт после правки справки (docs/stack.md, 1.4).
  repository_dispatch:
    types: [bot-docs-updated]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pipx install "poetry>=2,<3"
      - run: poetry config virtualenvs.in-project true
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pyright
      - run: poetry run pytest -q
      - run: docker build -t chestor-api .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-docs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Indexing files are in the build
        run: |
          for file in robots.txt sitemap.xml llms.txt llms-full.txt md/ru/start.md ru/docs/index.html en/docs/index.html; do
            test -s "out/$file" || { echo "missing out/$file"; exit 1; }
          done
          grep -q "<loc>https://chestor-bot.site/ru/docs/start/</loc>" out/sitemap.xml
          grep -q '"@type":"FAQPage"' out/ru/index.html
